{% extends "base.html" %}
{% block titulo %}Nova redação — AIM.Edu{% endblock %}
{% block conteudo %}
<div class="card">
  <h2>Nova redação</h2>
  <p>Escreva um texto dissertativo-argumentativo (recomendado: entre 200 e 350 palavras, com introdução, desenvolvimento e conclusão com proposta de intervenção).</p>
  <form method="post" action="{{ url_for('redacao.enviar') }}">
    <label for="tema">Tema da redação</label>
    <input type="text" id="tema" name="tema" placeholder="Ex.: Os desafios da mobilidade urbana nas grandes cidades brasileiras" style="width:100%; padding:10px; border:1px solid var(--borda); border-radius:6px; font-size:0.95rem;">

    <label for="texto" style="margin-top:16px;">Texto</label>
    <textarea id="texto" name="texto" rows="20" required style="width:100%; padding:12px; border:1px solid var(--borda); border-radius:6px; font-size:0.95rem; font-family:inherit;" placeholder="Escreva sua redação aqui..."></textarea>

    <button class="botao" type="submit" style="margin-top:16px;">Enviar para correção</button>
  </form>
</div>
{% endblock %}
