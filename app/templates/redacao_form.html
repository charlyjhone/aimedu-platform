{% extends "base.html" %}
{% block titulo %}Nova redação — AIM.Edu{% endblock %}
{% block conteudo %}
<div class="card">
  <h2>Nova redação</h2>
  <p style="color:#666; font-size:0.85rem;">Tire uma foto da sua redação manuscrita — não precisa digitar o texto. A correção por IA aparece assim que estiver disponível.</p>

  <form method="post" action="{{ url_for('redacao.enviar') }}" enctype="multipart/form-data">
    <label for="tema">Tema da redação (opcional)</label>
    <input type="text" id="tema" name="tema" value="{{ form.get('tema', '') if form else '' }}" placeholder="Ex.: Os desafios da mobilidade urbana nas grandes cidades brasileiras" style="width:100%; padding:10px; border:1px solid var(--borda); border-radius:6px; font-size:0.95rem;">

    <label for="arquivo" style="margin-top:16px;">Foto da redação</label>
    <input type="file" id="arquivo" name="arquivo" accept="image/*" capture="environment" required style="display:block; margin-top:6px;">

    <button class="botao" type="submit" style="margin-top:20px;">Enviar para correção</button>
  </form>
</div>
{% endblock %}
