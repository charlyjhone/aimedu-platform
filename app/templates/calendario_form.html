{% extends "base.html" %}
{% block titulo %}Novo evento — AIM.Edu{% endblock %}
{% block conteudo %}
<div class="card">
  <h2>Novo evento</h2>
  <form method="post">
    <label for="titulo">Título</label>
    <input type="text" name="titulo" id="titulo" required maxlength="120" placeholder="Ex: Reunião de pais, Prova bimestral...">

    <label for="data_evento">Data</label>
    <input type="date" name="data_evento" id="data_evento" required>

    <label for="descricao">Descrição (opcional)</label>
    <textarea name="descricao" id="descricao" rows="2"></textarea>

    <label for="publico">Para quem é</label>
    <select name="publico" id="publico">
      {% for slug, rotulo in publicos_label.items() %}
      <option value="{{ slug }}">{{ rotulo }}</option>
      {% endfor %}
    </select>

    {% if mostrar_segmento %}
    <label for="segmento">Segmento (opcional)</label>
    <select name="segmento" id="segmento">
      <option value="">Todos os segmentos</option>
      {% for slug, rotulo in segmentos_label.items() %}
      <option value="{{ slug }}">{{ rotulo }}</option>
      {% endfor %}
    </select>
    {% endif %}

    <button class="botao" type="submit" style="margin-top:20px;">Salvar evento</button>
  </form>
  <p style="margin-top:16px;"><a href="{{ url_for('calendario.index') }}">&larr; Cancelar e voltar</a></p>
</div>
{% endblock %}
