{% extends "base.html" %}
{% block titulo %}{% if turma %}Editar turma{% else %}Nova turma{% endif %} — AIM.Edu{% endblock %}
{% block conteudo %}
<div class="card">
  <h2>{% if turma %}Editar turma{% else %}Nova turma{% endif %}</h2>

  <form method="post">
    <label for="serie_id">Série</label>
    <select name="serie_id" id="serie_id" required>
      <option value="">Selecione...</option>
      {% for s in series %}
      <option value="{{ s['id'] }}" {% if form.get('serie_id') == s['id'] %}selected{% endif %}>{{ s['nome'] }}</option>
      {% endfor %}
    </select>

    <label for="nome" style="margin-top:16px;">Nome da turma</label>
    <input type="text" id="nome" name="nome" value="{{ form.get('nome', '') }}" placeholder="Ex.: 1º Ano A" required>

    <label for="ano_letivo" style="margin-top:16px;">Ano letivo</label>
    <input type="number" id="ano_letivo" name="ano_letivo" value="{{ form.get('ano_letivo', '') }}" required>

    <button class="botao" type="submit" style="margin-top:20px;">{% if turma %}Salvar alterações{% else %}Criar turma{% endif %}</button>
  </form>
</div>

<a href="{{ url_for('turmas.gestao') }}">&larr; Voltar</a>
{% endblock %}
