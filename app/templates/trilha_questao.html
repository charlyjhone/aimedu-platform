{% extends "base.html" %}
{% block titulo %}Trilha Adaptativa — AIM.Edu{% endblock %}
{% block conteudo %}
<div class="card">
  <span class="tag">{{ nome_disciplina }}</span>
  <span class="tag">{{ habilidade }}</span>
  <span class="tag">{{ streak_atual }}/{{ meta }} seguidas</span>
  <div class="barra"><div style="width: {{ streak_atual / meta * 100 }}%;"></div></div>

  <h2>{{ item['enunciado'] }}</h2>

  <form method="post" action="{{ url_for('trilha_adaptativa.responder', disciplina=disciplina) }}">
    {% for alt in alternativas %}
      <button class="alternativa" type="submit" name="resposta" value="{{ alt['letra'] }}">
        <strong>{{ alt['letra'] }})</strong> {{ alt['texto'] }}
      </button>
    {% endfor %}
  </form>
</div>
{% endblock %}
