{% extends "base.html" %}
{% block titulo %}Relatório — {{ r['aluno_nome'] }}{% endblock %}
{% block conteudo %}
<div class="card">
  <h2>Relatório de {{ r['periodo'] }}</h2>
  <p style="color:#666; font-size:0.85rem;">{{ r['aluno_nome'] }} · gerado em {{ r['criado_em']|data }}</p>
  <p style="margin-top:16px;">{{ r['conteudo'] }}</p>
</div>

<a href="{{ url_for('relatorios_familia.aluno', aluno_id=r['aluno_id']) }}">&larr; Voltar</a>
{% endblock %}
