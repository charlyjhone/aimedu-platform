{% extends "base.html" %}
{% block titulo %}{% if serie %}Editar série{% else %}Nova série{% endif %} — AIM.Edu{% endblock %}
{% block conteudo %}
<div class="card">
  <h2>{% if serie %}Editar série{% else %}Nova série{% endif %}</h2>

  <form method="post">
    <label for="nome">Nome da série</label>
    <input type="text" id="nome" name="nome" value="{{ form.get('nome', '') }}" placeholder="Ex.: 1º Ano, Maternal II, 3ª Série" required>

    <label for="etapa" style="margin-top:16px;">Segmento</label>
    <select name="etapa" id="etapa" required>
      <option value="">Selecione...</option>
      {% for slug, rotulo in segmentos %}
      <option value="{{ slug }}" {% if form.get('etapa') == slug %}selected{% endif %}>{{ rotulo }}</option>
      {% endfor %}
    </select>

    <label for="ordem" style="margin-top:16px;">Ordem de exibição (opcional — se vazio, entra por último)</label>
    <input type="number" id="ordem" name="ordem" value="{{ form.get('ordem', '') }}" min="1">

    <button class="botao" type="submit" style="margin-top:20px;">{% if serie %}Salvar alterações{% else %}Criar série{% endif %}</button>
  </form>
</div>

<a href="{{ url_for('turmas.gestao') }}">&larr; Voltar</a>
{% endblock %}
